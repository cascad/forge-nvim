schema: spec-driven

context: |
  Language: Russian
  All artifacts must be written in Russian.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English
  (also GIVEN/WHEN/THEN/AND in scenarios).

  Проект: личный монорепо forge-nvim. Части:
  - wezterm.lua (корень) — терминал + мультиплексор, ОДИН файл для Windows
    и macOS (Linux — по возможности);
  - nvim_forge/ — Neovim-IDE (пока без спек);
  - nvim_forge/scripts/install-*.sh|ps1 — установщики.
  Целевые версии: WezTerm 20240203-110809-5046fc22 (stable; в main те же
  места кода), Neovim 0.12, macOS /bin/bash 3.2. Две машины: Windows
  (эта) и Mac (удалённая, проверять на месте нельзя).
  Раскладки: русская (RussianWin/ЙЦУКЕН) и английская на обеих ОС.

  ТЕКУЩАЯ ФАЗА: 1 «базовая линия» (с 2026-09-27). Переход в фазу 2 —
  после проверки владельцем (change review-baseline); тогда здесь пишется
  «ТЕКУЩАЯ ФАЗА: 2 «источник правды» (с <дата>)».

  Жизненный цикл спек (ВАЖНО, определяет, кто прав при расхождении):
  - Фаза 1 «базовая линия»: specs/ сняты с
    реального кода (рабочее дерево) и описывают его КАК ЕСТЬ, включая
    странности и баги. Источник правды — код. Спека, расходящаяся с
    кодом, — ошибка спеки: чинится спека. README и docs/*.md — тоже
    производные от кода (и местами устарели).
  - Всё, что владелец решил изменить, и все найденные баги — это
    openspec/changes/<id>/ с delta (MODIFIED/ADDED/REMOVED) к базовой
    линии. Пока change не применён и не заархивирован, specs/ не меняются.
  - Фаза 2 «источник правды»: после того как владелец проверил
    базовую линию (строка «ТЕКУЩАЯ ФАЗА» выше). С этого момента
    specs/ — намерение владельца; код, расходящийся со спекой, — баг;
    README и docs/*.md — производные от specs.

  Роли артефактов — один источник на каждый вопрос:
  - openspec/specs/ — поведение (фаза 1: как есть; фаза 2: как должно).
  - openspec/changes/<id>/ — изменения поведения и баги, в виде delta к
    specs. Change без delta (рефакторинг, тесты, доки) — со
    `skip_specs: true` в .openspec.yaml.
  - nvim_forge/FIXLOG.md — журнал инцидентов (Проблема → Причина →
    Изменение → Проверка/e2e → Вывод → Файлы), append-only. Единая
    хронология — docs/HISTORY.md, шаблон — docs/history/ENTRY_TEMPLATE.md.
    Причина и гипотеза различаются; неизвестные даты не придумываются.
    Новая запись, задевающая поведение,
    содержит строку `Спека: <ID> (ADDED|MODIFIED|REMOVED|FIX)`.
  - PROBLEMS.md — входящие хотелки/жалобы до разбора.
  - docs/*.md, README — руководства для человека (производные).

  Формат требований:
  - Заголовок `### Requirement: <ID> <короткое название>`. ID стабильны и
    никогда не переиспользуются. Префиксы: WT-LOAD (загрузка конфига),
    WT-KBD (клавиатурный протокол), WT-KEYS (владение клавишами),
    WT-CLIP (буфер обмена), WT-WIN (режим WINDOWS), WT-PANE (панели,
    вкладки, воркспейсы), WT-SCROLL (скроллбэк, copy/search mode),
    WT-STATE (размер окна и шрифта), WT-UI (вид, статус-бар, шелл),
    MAC-INST (установщик macOS).
    IDE-BOOT (подготовка и обычный запуск редактора),
    IDE-DAP (вывод и жизненный цикл отладки), IDE-TEST (запуск тестов),
    IDE-SNIP (ввод и отмена snippet-предложений), IDE-PANEL (управление панелями),
    IDE-GIT (Git, ветки, worktree и корень рабочей папки),
    IDE-FILE (операции с файлами в дереве), IDE-BUF (файловые вкладки и закрытие).
  - Первое предложение требования содержит SHALL/MUST. Дальше строки
    `Платформы: windows|macos|linux|все`, если есть — `История: FIXLOG §N`,
    и `Проверка: <tests/… (сценарий)> | вручную (<где записан результат>)`,
    когда способ проверки известен.
  - Инварианты и корнер-кейсы — отдельными сценариями
    (`#### Scenario:` с **GIVEN**/**WHEN**/**THEN**/**AND**).
  - Спека описывает наблюдаемое поведение, не устройство кода. Настройки
    WezTerm упоминаются, только если сама настройка и есть контракт.

  Правила для агента:
  - Фаза 1: specs/ обязаны совпадать с кодом. Нашёл расхождение — поправь
    спеку под код (это уточнение базовой линии, не изменение поведения).
    Хочешь поменять поведение — change с delta, код не трогай без него.
  - Фаза 2: спека — намерение владельца. Не меняй specs/, чтобы код или
    тест «прошли»; изменение поведения — только через change + явное
    согласие владельца. Код, расходящийся со спекой, — баг: чинить код,
    в FIXLOG `Спека: ID (FIX)`.
  - Проверка, которая что-то доказала, кладётся в tests/ того же коммита.

rules:
  proposal:
    - "Для бага (код расходится со спекой или с намерением владельца) в Why назвать ID требований, как воспроизвести и где в коде."
    - "Решения владельца, от которых зависит спека или задачи, должны быть получены ДО specs/tasks; нет решения — change стоит на proposal."
  specs:
    - "Каждое требование — с ID из списка префиксов и хотя бы одним сценарием; ID не меняются и не переиспользуются."
    - "MODIFIED повторяет требование целиком, со всеми прежними сценариями."
  design:
    - "Non-Goals обязательны, если change граничит с соседними capability."
    - "В Open Questions — только то, что можно решить позже, не меняя спеку, подход и задачи."
  tasks:
    - "В группе, меняющей поведение, есть задача на запись FIXLOG со строкой `Спека: <ID> (ADDED|MODIFIED|REMOVED|FIX)` и на правку docs, которые это поведение описывают."
    - "У каждого исправления есть история: проблема, причина, изменение, проверка/e2e, вывод и файлы; обновляется docs/HISTORY.md. Шаблон — docs/history/ENTRY_TEMPLATE.md."
    - "Проверка — в каждой задаче: тест из tests/, команда или ручной шаг с платформой (windows|macos|linux/ubuntu); непроверенные среды помечаются явно."
