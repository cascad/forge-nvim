[package]
name = "fride-setup"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Общий frontend установки Fride"
license = "MIT"

[dependencies]
cliclack = "=0.5.6"
console = "=0.16.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
